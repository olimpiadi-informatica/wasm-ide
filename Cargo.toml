[workspace]
members = ["worker", "frontend", "common"]
resolver = "2"

[workspace.package]
version = "0.1.1"

[package]
name = "wasm-ide"
version.workspace = true
edition = "2024"
publish = false

[dev-dependencies]
common = { path = "common" }
futures = "0.3.32"
js-sys = "0.3.82"
serde = "1.0.228"
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.100"
wasm-bindgen-test = "0.3.55"
web-sys = { version = "0.3.82", features = ["MessageEvent", "Worker"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
debug = 0
strip = true
codegen-units = 1
