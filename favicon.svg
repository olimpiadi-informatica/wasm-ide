<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#654FF0" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="iso-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="cube-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#cube-drop)">
    <!-- TOP FACE -->
    <polygon points="256,40 443.06,148 256,256 68.94,148"
             fill="url(#cube-top)"
             stroke="#38BDF8"
             stroke-width="2"
             stroke-linejoin="round" />

    <!-- Recessed Dark Wasm Socket on Top Face -->
    <polygon points="256,84 366,148 256,212 146,148"
             fill="#0F172A" />
    <polygon points="256,112 318,148 256,184 194,148"
             fill="#654FF0" />

    <!-- LEFT FACE (`>_` Code Prompt) -->
    <polygon points="68.94,148 256,256 256,472 68.94,364"
             fill="url(#cube-left)"
             stroke="#6366F1"
             stroke-width="2"
             stroke-linejoin="round" />

    <path d="M 116,226 L 176,296 L 116,330"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <line x1="184" y1="344" x2="224" y2="367"
          stroke="#38BDF8"
          stroke-width="22"
          stroke-linecap="round" />

    <!-- RIGHT FACE (Isometric `▶` Play Button) -->
    <polygon points="256,256 443.06,148 443.06,364 256,472"
             fill="url(#cube-right)"
             stroke="#312E81"
             stroke-width="2"
             stroke-linejoin="round" />

    <!-- True Isometric `▶` Play Triangle on Right Face -->
    <polygon points="304,264 402,268 304,388"
             fill="url(#iso-play)"
             stroke="url(#iso-play)"
             stroke-width="18"
             stroke-linejoin="round" />
  </g>
</svg>
